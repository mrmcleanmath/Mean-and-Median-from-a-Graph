<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mean and Median from a Graph — Mr. McLean Math</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#202124;--muted:#666b73;--border:#d9dde3;--accent:#1976d2;--soft:#e8f1fb;--good:#247a3b;--bad:#b3261e;--focus:#f5b400;--graph:#1976d2;--point:#202124}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
body.high-contrast{--bg:#000;--panel:#090909;--text:#fff;--muted:#ddd;--border:#777;--accent:#00d7ff;--soft:#111;--good:#68ff8b;--bad:#ff7474;--focus:#ffea00;--graph:#00d7ff;--point:#fff}
.app{max-width:980px;margin:auto;padding:18px}header,.toolbar,.controls,.group,.answer-row,.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header,.toolbar{justify-content:space-between;margin-bottom:14px}h1{margin:0;font-size:clamp(28px,5vw,36px)}.controls{gap:12px}
button,input{font:inherit}button{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:9px 13px;cursor:pointer;font-weight:650}
button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button[aria-pressed=true],button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;display:grid;gap:15px}
.prompt{font-size:clamp(21px,4vw,28px);font-weight:800}.graph-wrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:14px;padding:10px}
.graph-svg{display:block;width:100%;min-width:620px;height:430px}.axis-label{font-size:16px;font-weight:700;fill:var(--text)}.tick-label{font-size:14px;fill:var(--text)}
.graph-title{font-size:18px;font-weight:800;fill:var(--text)}.grid-line{stroke:var(--border)}.axis-line{stroke:var(--text);stroke-width:2}.bar{fill:var(--graph);opacity:.88}
.line-graph{stroke:var(--graph);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.point{fill:var(--point);stroke:var(--panel);stroke-width:3}
.notice{text-align:center;color:var(--muted);font-weight:650}.answer-row{justify-content:center}.answer-row input{width:min(300px,100%);font-size:21px;text-align:center;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text)}
.feedback{min-height:28px;text-align:center;font-size:18px;font-weight:700}.correct{color:var(--good)}.incorrect{color:var(--bad)}.warn{color:var(--muted)}
.explain{max-width:760px;width:100%;margin:auto;background:var(--soft);border:1px solid var(--border);border-radius:11px;padding:11px 13px;white-space:pre-line}
.stats{justify-content:center;gap:20px;color:var(--muted);font-size:15px}footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
@media(max-width:620px){.app{padding:13px}.panel{padding:14px}.answer-row{align-items:stretch}.answer-row input,.answer-row button{width:100%}}
</style></head><body>
<div class="app">
<header><h1>Mean and Median from a Graph</h1><button id="contrastBtn" aria-pressed="false">High contrast</button></header>
<div class="toolbar"><div class="controls">
<div class="group" id="mathModes"><button data-mode="regular" aria-pressed="true">Regular</button><button data-mode="advanced" aria-pressed="false">Advanced</button></div>
<div class="group" id="topics"><button data-topic="mean" aria-pressed="true">Mean</button><button data-topic="median" aria-pressed="false">Median</button></div>
</div></div>
<main class="panel">
<div id="prompt" class="prompt"></div><div id="graphBox" class="graph-wrap"></div><div id="calculatorNotice" class="notice" hidden>Calculator allowed</div>
<div class="answer-row"><input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter your answer"><button id="check" class="primary">Check</button><button id="next" hidden>Next</button></div>
<div id="feedback" class="feedback" aria-live="polite"></div><button id="showSteps" hidden style="justify-self:center">Show steps</button><div id="steps" class="explain" hidden></div>
<div class="stats"><span>Correct: <strong id="correctCount">0</strong></span><span>Incorrect: <strong id="incorrectCount">0</strong></span></div>
</main><footer>Created by Mr. McLean Math</footer></div>
<script>
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const state={mode:"regular",topic:"mean",current:null,evaluated:false,correct:0,incorrect:0,recentKeys:[]};
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a} function choose(a){return a[randInt(0,a.length-1)]}
function rowsKey(r){return r.map(x=>x.term+"x"+x.frequency).join("|")}
function strictNumber(raw){if(raw==null)return null;let s=String(raw).trim().replace(/\s+/g,"");if(!s)return null;if(s.includes(".")&&s.includes(","))return null;if(s.includes(","))s=s.replace(",",".");if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;const n=Number(s);return Number.isFinite(n)?n:null}
function numberDisplay(n){if(Number.isInteger(n))return String(n);if(Math.abs(n*2-Math.round(n*2))<1e-9)return String(Math.round(n*2)/2);return String(Math.round(n*100)/100)}
function expandedValues(rows){const v=[];rows.forEach(r=>{for(let i=0;i<r.frequency;i++)v.push(r.term)});return v}
const totalFrequency=r=>r.reduce((s,x)=>s+x.frequency,0), weightedSum=r=>r.reduce((s,x)=>s+x.term*x.frequency,0);
const calcMeanFromRows=r=>weightedSum(r)/totalFrequency(r);
function calcMedianFromRows(r){const v=expandedValues(r).sort((a,b)=>a-b),n=v.length;return n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2}
function hasVariedFrequencies(r){const f=r.map(x=>x.frequency);return new Set(f).size>=3&&f.some(x=>x>1)}
function isClean(v,m){return m==="regular"?Number.isInteger(v):Number.isInteger(v)||Math.abs(v*2-Math.round(v*2))<1e-9}
function generateTerms(n,m){const min=m==="regular"?1:2,max=m==="regular"?12:25,steps=m==="regular"?[1,1,1,2]:[1,1,2,2,3];const start=randInt(min,max-n-2),t=[start];while(t.length<n){const x=t[t.length-1]+choose(steps);if(x>max)return generateTerms(n,m);t.push(x)}return t}
function generateRows(m){const n=m==="regular"?randInt(4,6):randInt(5,7),t=generateTerms(n,m),maxF=m==="regular"?4:6;return t.map(term=>({term,frequency:randInt(1,maxF)}))}
const FALLBACKS={
regular:{mean:[{term:2,frequency:1},{term:4,frequency:2},{term:6,frequency:3},{term:8,frequency:2}],median:[{term:2,frequency:2},{term:4,frequency:3},{term:6,frequency:3},{term:8,frequency:2}]},
advanced:{mean:[{term:5,frequency:2},{term:8,frequency:2},{term:11,frequency:2},{term:14,frequency:2},{term:17,frequency:2}],median:[{term:5,frequency:2},{term:8,frequency:3},{term:11,frequency:4},{term:14,frequency:3},{term:17,frequency:2}]}
};
function buildQuestion(topic,mode,used){
 for(let a=0;a<2500;a++){const rows=generateRows(mode),graphType=mode==="regular"?"bar":choose(["bar","barline"]),key=mode+"::"+topic+"::"+graphType+"::"+rowsKey(rows);if(used&&used.has(key))continue;if(!hasVariedFrequencies(rows))continue;
 const total=totalFrequency(rows);if(mode==="regular"&&(total<8||total>18))continue;if(mode==="advanced"&&(total<14||total>30))continue;
 const ans=topic==="mean"?calcMeanFromRows(rows):calcMedianFromRows(rows);if(!isClean(ans,mode))continue;if(topic==="mean"&&((mode==="regular"&&(ans<2||ans>11))||(mode==="advanced"&&(ans<4||ans>23))))continue;
 if(used)used.add(key);return {topic,mode,rows,graphType,answer:ans,calculatorAllowed:topic==="mean"&&mode==="advanced",key}}
 const rows=FALLBACKS[mode][topic].map(x=>({...x}));return {topic,mode,rows,graphType:"bar",answer:topic==="mean"?calcMeanFromRows(rows):calcMedianFromRows(rows),calculatorAllowed:topic==="mean"&&mode==="advanced",key:mode+"::"+topic+"::fallback"}
}
function nextQuestion(){const q=buildQuestion(state.topic,state.mode,new Set(state.recentKeys));state.recentKeys.push(q.key);if(state.recentKeys.length>50)state.recentKeys.shift();return q}
function niceYAxisMax(m){if(m<=4)return 4;if(m<=6)return 6;if(m<=8)return 8;return Math.ceil(m/2)*2}
function renderGraph(q){
 const r=q.rows,w=760,h=430,left=72,right=28,top=54,bottom=70,cw=w-left-right,ch=h-top-bottom,yMax=niceYAxisMax(Math.max(...r.map(x=>x.frequency))),step=yMax<=6?1:2,slot=cw/r.length,bw=Math.min(54,slot*.55);
 const xc=i=>left+slot*i+slot/2,yv=v=>top+ch-(v/yMax)*ch;let s=`<svg class="graph-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Frequency graph"><text class="graph-title" x="${w/2}" y="28" text-anchor="middle">${q.graphType==="barline"?"Bar-line graph":"Bar graph"}</text>`;
 for(let y=0;y<=yMax;y+=step){const py=yv(y);s+=`<line class="grid-line" x1="${left}" y1="${py}" x2="${w-right}" y2="${py}"></line><text class="tick-label" x="${left-14}" y="${py+5}" text-anchor="end">${y}</text>`}
 s+=`<line class="axis-line" x1="${left}" y1="${top}" x2="${left}" y2="${top+ch}"></line><line class="axis-line" x1="${left}" y1="${top+ch}" x2="${w-right}" y2="${top+ch}"></line><text class="axis-label" x="${w/2}" y="${h-22}" text-anchor="middle">Term</text><text class="axis-label" transform="translate(22 ${top+ch/2}) rotate(-90)" text-anchor="middle">Frequency</text>`;
 if(q.graphType==="bar"){r.forEach((x,i)=>{const X=xc(i),Y=yv(x.frequency);s+=`<rect class="bar" x="${X-bw/2}" y="${Y}" width="${bw}" height="${top+ch-Y}" rx="6"></rect><text class="tick-label" x="${X}" y="${top+ch+28}" text-anchor="middle">${x.term}</text>`})}
 else{const pts=r.map((x,i)=>`${xc(i)},${yv(x.frequency)}`).join(" ");s+=`<polyline class="line-graph" points="${pts}"></polyline>`;r.forEach((x,i)=>{const X=xc(i),Y=yv(x.frequency);s+=`<circle class="point" cx="${X}" cy="${Y}" r="8"></circle><line class="grid-line" x1="${X}" y1="${Y}" x2="${X}" y2="${top+ch}"></line><text class="tick-label" x="${X}" y="${top+ch+28}" text-anchor="middle">${x.term}</text>`})}
 return s+"</svg>"
}
function explain(q){
 if(q.topic==="mean"){const t=totalFrequency(q.rows),w=weightedSum(q.rows),p=q.rows.map(r=>`${r.term} × ${r.frequency}`).join(" + ");return `Read each term and frequency from the graph.\n\n${p} = ${w}\nTotal frequency = ${t}\n${w} ÷ ${t} = ${numberDisplay(q.answer)}`}
 const v=expandedValues(q.rows).sort((a,b)=>a-b),n=v.length;if(n%2){const pos=(n+1)/2;return `Total frequency = ${n}\nMedian position = ${pos}\n\nExpanded in order:\n${v.join(", ")}\n\nMedian = ${numberDisplay(q.answer)}`}
 const l=n/2,r=l+1,a=v[l-1],b=v[r-1];return `Total frequency = ${n}\nMiddle positions = ${l} and ${r}\n\nExpanded in order:\n${v.join(", ")}\n\nMiddle values: ${a} and ${b}\nMedian = ${numberDisplay(q.answer)}`
}
function load(){state.current=nextQuestion();state.evaluated=false;$("#prompt").textContent=state.topic==="mean"?"Calculate the mean from the graph.":"Calculate the median from the graph.";$("#graphBox").innerHTML=renderGraph(state.current);$("#calculatorNotice").hidden=!state.current.calculatorAllowed;$("#answer").value="";$("#answer").disabled=false;$("#check").disabled=false;$("#next").hidden=true;$("#feedback").textContent="";$("#feedback").className="feedback";$("#showSteps").hidden=true;$("#steps").hidden=true;$("#steps").textContent="";$("#answer").focus()}
function check(){if(state.evaluated)return;const v=strictNumber($("#answer").value);if(v===null){$("#feedback").textContent="Enter a valid number first.";$("#feedback").className="feedback warn";return}state.evaluated=true;$("#answer").disabled=true;$("#check").disabled=true;$("#next").hidden=false;if(Math.abs(v-state.current.answer)<1e-9){state.correct++;$("#feedback").textContent="Correct!";$("#feedback").className="feedback correct"}else{state.incorrect++;$("#feedback").textContent=`Incorrect. Correct answer: ${numberDisplay(state.current.answer)}`;$("#feedback").className="feedback incorrect";$("#showSteps").hidden=false}$("#correctCount").textContent=state.correct;$("#incorrectCount").textContent=state.incorrect}
$("#check").onclick=check;$("#next").onclick=load;$("#showSteps").onclick=()=>{$("#steps").textContent=explain(state.current);$("#steps").hidden=false;$("#showSteps").hidden=true};
$("#answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();state.evaluated?load():check()}else if(e.key==="Escape"&&!state.evaluated)$("#answer").value=""});
$("#mathModes").onclick=e=>{const b=e.target.closest("button[data-mode]");if(!b)return;state.mode=b.dataset.mode;state.recentKeys=[];$$("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));load()};
$("#topics").onclick=e=>{const b=e.target.closest("button[data-topic]");if(!b)return;state.topic=b.dataset.topic;state.recentKeys=[];$$("[data-topic]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));load()};
$("#contrastBtn").onclick=()=>{const on=document.body.classList.toggle("high-contrast");$("#contrastBtn").setAttribute("aria-pressed",String(on));if(state.current)$("#graphBox").innerHTML=renderGraph(state.current)};
load();
</script></body></html>
